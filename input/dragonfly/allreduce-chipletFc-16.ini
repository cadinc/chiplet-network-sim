[Network]
router_stages = OneStage
topology = DragonflyChipletFC
routing_algorithm = MIN
k_node = 5
buffer_size = 32
vc_number = 5
internal_bandwidth = 1
external_latency = 8
internal_latency = 1
mis_routing = false

[Workload]
# traffic = all_to_all
traffic = uniform
# traffic_scale = 16
traffic_scale = 128
packet_length = 4

[Simulation]
injection_increment = 0.010
# The 4x4 2D-mesh is equivalent to 4 Chips
# Since there is 4 nodes per chip, equivalent to 0.1 flit/chip

