# 3D mesh C-group -- full Dragonfly network
# k=3 gives 3x3x3 = 27 chiplets per C-group
# cgroup_radix = 27, manageable network size

[Network]
topology = DragonflyChiplet3D
k_node = 3
single_cgroup = false
max_wgroups = 25
routing_algorithm = MIN
internal_bandwidth = 1
external_latency = 8
mis_routing = false
buffer_size = 32
vc_number = 3

[Workload]
traffic = uniform
traffic_scale = 0
packet_length = 4

[Simulation]
injection_increment = 0.02
simulation_time = 10000
timeout_threshold = 500
timeout_limit = 100
threads = 2

[Files]
output_file = ../../output/output_3d_k3_uniform.csv
log_file = ../../output/log_3d_k3.txt

