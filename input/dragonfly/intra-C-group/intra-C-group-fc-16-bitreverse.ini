# Intra-C-group benchmark for fully-connected (FC) topology.
# Analogous to intra-C-group-chiplet-16.ini but with FC C-group.
#
# Single C-group: 4x4=16 chiplets, each with 15 internal FC ports + 1 external (unused).
# Each chiplet is a single injection point (1 node per chiplet).
# traffic_scale = 16 matches the 4x4=16 nodes in the 2D-mesh reference test.
#
# VC assignment: Case 1 routing uses VC 2, so vc_number >= 3 required.
#
# Injection rate per chip = injection_increment value (each chiplet IS the node).
# Expected results (compare with intra-C-group-chiplet-16.ini "Switch" baseline):
#   uniform:    saturation near 1.0 flit/chip/cycle (single-hop, no contention)
#   bitreverse: saturation near 1.0 flit/chip/cycle (all paths are 1-hop)
# The FC topology achieves nearly ideal throughput because every pair is directly
# connected — no intermediate hops, no bisection bottleneck.

[Network]
router_stages = OneStage
topology = DragonflyChipletFC
routing_algorithm = MIN
k_node = 4
single_cgroup = true
buffer_size = 32
vc_number = 3
internal_bandwidth = 1
external_latency = 8

[Workload]
# Change to bitreverse for Fig 10b equivalent
traffic = bitreverse
packet_length = 4

[Simulation]
injection_increment = 0.025
# 16 chiplets total; injection_increment steps correspond to
# 0.025 flits/cycle/chip directly (1 node per chiplet)

[Files]
output_file = ../../output/intrac-fc-bitreverse.csv
log_file = ../../output/intrac-fc-bitreverse.txt
