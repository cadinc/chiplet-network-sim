# Intra-C-group benchmark for 2D torus topology.
# Uses the existing MultiChipTorus topology (k_chip=2, k_node=2).
#
# Structure: 2x2 torus of chips, each chip has 2x2 internal nodes = 16 nodes total.
# This directly matches the MultiChipMesh reference test in scale and node count.
# The difference is that wrap-around links are added in both x and y directions,
# giving every node degree 4 (vs. corner nodes having degree 2 in the mesh).
#
# CLUE routing is deadlock-free on a 2D torus (uses 2 VCs: adaptive VC-0, NFR VC-1).
#
# Injection rate per chip = injection_increment * 4 (4 nodes per chip).
# Expected results: better saturation throughput than mesh for adversarial patterns
# (bit-reverse, bit-transpose) because the torus provides more balanced paths.

[Network]
router_stages = OneStage
topology = MultiChipTorus
routing_algorithm = CLUE
k_node = 2
k_chip = 2
buffer_size = 32
vc_number = 2

[Workload]
# Change to bitreverse for Fig 10b equivalent
traffic = bitreverse
packet_length = 4

[Simulation]
injection_increment = 0.025
# 4 chips x 4 nodes/chip = 16 nodes total
# injection_increment=0.025 flit/node/cycle = 0.1 flit/chip/cycle

[Files]
output_file = ../../output/intrac-torus-bitreverse.csv
log_file = ../../output/intrac-torus-bitreverse.txt
