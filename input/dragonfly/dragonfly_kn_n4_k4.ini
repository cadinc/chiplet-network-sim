# k-ary n-cube: n=4 (4D hypercube), k=4
# 256 chiplets per C-group, same 4k=16 external ports
# Use single_cgroup=true to avoid memory issues at n=4
[Network]
topology = DragonflyChipletKN
k_node = 3
n_dims = 3
routing_algorithm = MIN
internal_bandwidth = 1
external_latency = 8
mis_routing = false
buffer_size = 32
vc_number = 3
# single_cgroup = true

[Workload]
traffic = all_to_all_bi
traffic_scale = 128
packet_length = 4

[Simulation]
injection_increment = 0.02
simulation_time = 10000
timeout_threshold = 500
timeout_limit = 100

[Files]
output_file = ../../output/output_kn_n4_k4_uniform.csv
log_file = ../../output/log_kn_n4_k4.txt
