# AllReduce benchmark for fully-connected (FC) C-group Dragonfly.
# Reproduces Figure 14 data for the FC topology.
#
# TWO TEST MODES — toggle by swapping the commented lines:
#
# MODE A: Intra-C-group AllReduce (Fig 14a equivalent)
#   single_cgroup = true, traffic_scale = 16
#   Linear ring (1 direct FC hop per step). Expected: ~1 uni, ~2 bi flit/chiplet/cycle.
#
# MODE B: Intra-W-group AllReduce (Fig 14b equivalent)
#   single_cgroup = false, k_node = 3 → WG has 6 CGs × 9 = 54 chiplets
#   traffic_scale = 128  ← matches reference ring size (NOT WG size)
#
#   WHY 128 not 54: The reference DragonflyChiplet uses traffic_scale=128 with
#   a WG of only 36 nodes (3.6 WGs spanned). Using 128 for all topologies keeps
#   the ring size identical so throughput curves are comparable. The ring does
#   involve some global hops (128 > 54), but the reference does too.
#   With vc_number=5: global hops use VC 1, local hops use VC 2. No deadlock risk.
#
#   FC uses the linear ring (dest=(src+1)%scale, no 2D spatial structure in FC).
#   Expected (uni, 1xBW): ~1 flit/chiplet/cycle (inter-CG link bottleneck)
#   Expected (bi,  2xBW): ~2 flit/chiplet/cycle
#
# X-AXIS NOTE: Paper plots flit/chip/cycle where 1 chip = 4 DragonflyChiplet nodes.
#   For FC (1 node per chiplet), raw injection_rate = flit/chiplet/cycle directly.
#   For DragonflyChiplet reference curves, multiply injection_rate by 4.
#   To plot on same axis as reference: use injection_increment=0.005 for FC
#   (= 0.020/4) so saturation appears at the same x value as Figure 14b.

[Network]
router_stages = OneStage
topology = DragonflyChipletFC
routing_algorithm = MIN
buffer_size = 32
vc_number = 5
internal_bandwidth = 1
# Use internal_bandwidth = 2 for the SW-less-2B data point (Mode B only)
external_latency = 8

# ---- Mode A (intra-CG): active by default ----
# k_node = 4
# single_cgroup = true

# ---- Mode B (intra-WG): comment Mode A above, uncomment these ----
k_node = 3
single_cgroup = false

[Workload]
traffic = all_to_all
# traffic = all_to_all_bi

# Mode A intra-CG:  traffic_scale = 16
# Mode B intra-WG:  traffic_scale = 128
# traffic_scale = 16
traffic_scale = 128

packet_length = 4

[Simulation]
injection_increment = 0.025

[Files]
output_file = ../../output/intraW-fc-allreduce.csv
log_file = ../../output/intraW-fc-allreduce.txt
