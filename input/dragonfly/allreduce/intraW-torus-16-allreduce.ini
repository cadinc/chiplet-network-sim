# AllReduce benchmark for 2D torus C-group Dragonfly (DragonflyChipletKN).
# Reproduces Figure 14 data for the torus topology.
#
# TWO TEST MODES — toggle by swapping the commented lines:
#
# MODE A: Intra-C-group AllReduce (Fig 14a equivalent)
#   single_cgroup = true
#   traffic_scale = 16  (entire 4×4=16-node single CG)
#   Expected (uni):  saturation between mesh (bounded by bisection) and FC (1 hop)
#   Expected (bi):   same improvement pattern
#   Rationale: the torus adds wrap-around links, improving bisection bandwidth
#   of the C-group over the mesh. Every node has degree 4 (all directions occupied),
#   so the ring AllReduce utilises more links than in the mesh case.
#   The intra-CG unidirectional ring on a torus visits: 0→1→2→...→15→0.
#   XD_routing with use_torus=true picks the shortest direction each step
#   (all single-hop in the x-dimension for this linear ordering), so paths
#   are 1 hop per step and saturation should match the mesh at 1 flit/node/cycle
#   for uniform injection. The benefit appears under adversarial patterns.
#
# MODE B: Intra-W-group AllReduce (Fig 14b equivalent)
#   single_cgroup = false
#   k_node = 4, n_dims = 2, use_torus = true
#   WG has 8 CGs × 16 chiplets = 128 chiplets  ← IDENTICAL scale to local-chiplet-16.ini
#   traffic_scale = 128
#   Expected (uni, 1×BW):  saturation ~1.0 flit/chiplet/cycle
#   Expected (bi,  2×BW):  saturation ~2.0 flit/chiplet/cycle
#   The torus CG provides better intra-CG bisection bandwidth than the mesh,
#   so the intra-CG bottleneck that limits the mesh's bidirectional performance
#   is reduced here even without doubling the internal bandwidth.
#
# Node layout for traffic_manager id2nodeid:
#   core_per_chip = k_node^2 = 16
#   Mode A (single_cgroup): all 16 nodes in chip 0
#   Mode B: chips 0-7 map to CGs 0-7 of WG 0; each CG has 16 chiplets

[Network]
router_stages = OneStage
topology = DragonflyChipletKN
routing_algorithm = MIN
n_dims = 2
use_torus = true
buffer_size = 32
vc_number = 5
internal_bandwidth = 1
# Use internal_bandwidth = 2 for the SW-less-2B data point (Mode B only)
external_latency = 8

# ---- Mode A (intra-CG): uncomment these two lines ----
# k_node = 4
# single_cgroup = true

# ---- Mode B (intra-WG): comment Mode A above and uncomment these two lines ----
k_node = 4
single_cgroup = false

[Workload]
traffic = all_to_all
# traffic = all_to_all_bi

# Mode A intra-CG:  traffic_scale = 16
# Mode B intra-WG:  traffic_scale = 128
# traffic_scale = 16
traffic_scale = 128

packet_length = 4

[Simulation]
injection_increment = 0.025
# 1 node per chiplet.  injection_increment = 0.020 flit/chiplet/cycle.
# Mode A: 16 chiplets total.
# Mode B: 128 chiplets per WG.

[Files]
output_file = ../../output/intraW-torus-allreduce.csv
log_file = ../../output/intraW-torus-allreduce.txt

