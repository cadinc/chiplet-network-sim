[Network]
router_stages = OneStage
topology = DragonflyChipletKN
routing_algorithm = MIN
k_node = 4
n_dims = 2
use_torus = true
buffer_size = 32
vc_number = 5
# Use internal_bandwidth=2 for SW-less-2B data point
internal_bandwidth = 1
external_latency = 8

[Workload]
traffic = all_to_all
# traffic = all_to_all_bi
# traffic_scale = 16
traffic_scale = 128
packet_length = 4

[Simulation]
injection_increment = 0.025
# The 4x4 2D-mesh is equivalent to 4 Chips
# Since there is 4 nodes per chip, equivalent to 0.1 flit/chip

[Files]
output_file = ../../output/allreduce-torus.csv
log_file = ../../output/allreduce-torus.txt
