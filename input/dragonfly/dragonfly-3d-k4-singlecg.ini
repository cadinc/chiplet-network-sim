# 3D mesh C-group -- single C-group mode
# k=4 gives a 4x4x4 = 64 chiplet C-group
# 6 ports per chiplet internally, 1 external
# total internal links = 3 * 16 * 3 = 144
# compare: 2D mesh 4x4 = 24 links, FC 4x4 = 120 links

[Network]
topology = DragonflyChiplet3D
k_node = 4
single_cgroup = true
routing_algorithm = MIN
internal_bandwidth = 1
external_latency = 8
mis_routing = false
buffer_size = 32
vc_number = 3

[Workload]
traffic = uniform
traffic_scale = 0
packet_length = 4

[Simulation]
injection_increment = 0.02
simulation_time = 10000
timeout_threshold = 500
timeout_limit = 100
threads = 2

[Files]
output_file = ../../output/output_3d_k4_singlecg_uniform.csv
log_file = ../../output/log_3d_k4_singlecg.txt


