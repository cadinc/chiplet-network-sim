# Global (full-network) benchmark for 2D torus C-group Dragonfly.
# Analogous to global-chiplet-16.ini but with torus C-groups.
#
# Network scale with k_node=4, n_dims=2, use_torus=true:
#   41 W-groups x 8 C-groups x 16 chiplets = 5248 total chiplets
#   IDENTICAL external topology to global-chiplet-16.ini (same Dragonfly graph)
#   Only the C-group internal structure differs: torus instead of mesh.
#
# This is the cleanest comparison: same Dragonfly topology, same scale,
# same external port count — only the C-group internal wiring changes.
#
# Expected: torus C-groups have better intra-C-group bisection bandwidth
# than mesh, so global performance should match or exceed 2D-mesh at 1x
# bandwidth, and be clearly better at 2x bandwidth.

[Network]
router_stages = OneStage
topology = DragonflyChipletKN
routing_algorithm = MIN
k_node = 4
n_dims = 2
use_torus = true
buffer_size = 32
vc_number = 5
# Use internal_bandwidth=2 for SW-less-2B data point
internal_bandwidth = 1
external_latency = 8

[Workload]
# uniform or bitreverse
traffic = bitreverse
packet_length = 4

[Simulation]
injection_increment = 0.0125
threads = 16

[Files]
output_file = ../../output/global-torus-bitreverse.csv
log_file = ../../output/global-torus-bitreverse.txt
