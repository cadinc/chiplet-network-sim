# Global (full-network) benchmark for fully-connected (FC) C-group Dragonfly.
# Analogous to global-chiplet-16.ini but with FC C-groups.
#
# Network scale with k_node=3:
#   25 W-groups x 6 C-groups x 9 chiplets = 1350 total chiplets
#   (comparable to switch-based radix-16 Dragonfly: 1312 processors)
#
# Note: unlike the 2D mesh variant where k_node=4 gives cgroup_radix=12
# (matching radix-16 switch), here k_node=3 gives cgroup_radix=9. The FC
# topology uses ALL chiplets as external ports (one port per chiplet), so a
# smaller k is needed to stay at comparable total network size.
#
# injection_increment = 0.0125:
#   With 1350 nodes, 0.0125 flit/node/cycle = fine-grained sweep.
#
# Expected: global throughput similar to (or slightly below without 2B) the
# switch-based Dragonfly, and better with internal_bandwidth=2.

[Network]
router_stages = OneStage
topology = DragonflyChipletFC
routing_algorithm = MIN
k_node = 3
buffer_size = 32
vc_number = 5
internal_bandwidth = 1
external_latency = 8
# Use internal_bandwidth=2 for SW-less-2B data point

[Workload]
traffic = uniform
# uniform or bitreverse
packet_length = 4

[Simulation]
injection_increment = 0.0125
threads = 16

[Files]
output_file = ../../output/global-fc-uniform.csv
log_file = ../../output/global-fc-uniform.txt
