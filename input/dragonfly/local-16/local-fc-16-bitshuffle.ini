# Local (intra-W-group) benchmark for fully-connected (FC) C-group Dragonfly.
# Analogous to local-chiplet-16.ini but with FC C-groups.
#
# Network scale with k_node=3:
#   cgroup_radix = 9, l_ports = 5, g_ports = 4
#   cgroup_per_wgroup = 6, chips_per_wgroup = 6 x 9 = 54
#   Total: 25 W-groups, 150 C-groups, 1350 chiplets
#   (comparable to switch-based reference of 1312 processors)
#
# traffic_scale = 54: restrict traffic to one W-group (local test).
# Each chiplet is 1 node (no sub-structure), so:
#   injection_increment = 0.025 flit/node/cycle = 0.025 flit/chip/cycle.
#
# VC assignment:
#   VC 0: misrouting global (unused here, mis_routing=false)
#   VC 1: direct global hop
#   VC 2: local/intra-CG hops (Cases 1 & 2 in MIN_routing)
#   vc_number = 5 provides headroom for future misrouting tests.
#
# Expected: higher local saturation throughput than switch-based Dragonfly
# because any chiplet can reach its local external port in a single hop.

[Network]
router_stages = OneStage
topology = DragonflyChipletFC
routing_algorithm = MIN
k_node = 3
buffer_size = 32
vc_number = 5
# 1 or 2 (use 2 for SW-less-2B comparison)
internal_bandwidth = 1
external_latency = 8

[Workload]
# uniform / bitshuffle / bitreverse / bittranspose
traffic = bitshuffle
traffic_scale = 54
packet_length = 4

[Simulation]
injection_increment = 0.025
# 1 node per chiplet; 0.025 flit/node/cycle = 0.025 flit/chip/cycle

[Files]
output_file = ../../output/local-fc-bitshuffle.csv
log_file = ../../output/local-fc-bitshuffle.txt
