# Local (intra-W-group) benchmark for 2D torus C-group Dragonfly.
# Analogous to local-chiplet-16.ini but with torus C-groups.
#
# Network scale with k_node=4, n_dims=2, use_torus=true:
#   cgroup_radix = 4*4-4 = 12 (n=2 formula, same as 2D mesh)
#   l_ports = 7, g_ports = 5, cgroup_per_wgroup = 8
#   chips_per_wgroup = 8 x 16 = 128  ← IDENTICAL to local-chiplet-16.ini
#   Total: 41 W-groups, 328 C-groups, 5248 chiplets
#
# This allows a direct apples-to-apples comparison of mesh vs torus C-group
# performance at identical network scale and external port count.
#
# traffic_scale = 128: restrict traffic to one W-group (local test).
# Each chiplet is 1 node; 0.025 flit/node/cycle = 0.025 flit/chip/cycle.
#
# The torus adds wrap-around links, improving bisection bandwidth within the
# C-group. Expect better performance vs mesh especially under adversarial traffic.

[Network]
router_stages = OneStage
topology = DragonflyChipletKN
routing_algorithm = MIN
k_node = 4
n_dims = 2
use_torus = true
buffer_size = 32
vc_number = 5
# 1 or 2 (use 2 for SW-less-2B comparison)
internal_bandwidth = 1
external_latency = 8

[Workload]
# uniform / bitshuffle / bitreverse / bittranspose
traffic = bittranspose
traffic_scale = 128
packet_length = 4

[Simulation]
injection_increment = 0.025
# 1 node per chiplet; 0.025 flit/node/cycle

[Files]
output_file = ../../output/local-torus-bittranspose.csv
log_file = ../../output/local-torus-bittranspose.txt
